name: Daily Sync Upstream

on:
  schedule:
    # 每天北京时间 UTC+8 凌晨 4:00 运行 (对应 UTC 20:00)
    - cron: '0 20 * * *'
  # 支持手动在 Actions 页面点击测试
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          # 1. 配置 Git 身份信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. 添加原仓库为 upstream 源
          git remote add upstream https://github.com/dc021026/usque-custom-pro.git
          
          # 3. 获取原仓库最新代码
          git fetch upstream

          # 4. 确认处于本地 main 分支（若原仓库是 master，请把 main 改为 master）
          git checkout main

          # 5. 合并原仓库的 main 分支
          git merge upstream/main --allow-unrelated-histories -m "Chore: auto sync from upstream"

          # 6. 推送到你自己的仓库
          git push origin main
